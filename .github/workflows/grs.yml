name: Refresh profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Download fresh cards
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p profile

          curl --fail --location --retry 3 --retry-all-errors \
            "https://github-readme-stats.vercel.app/api?username=${OWNER}&show_icons=true&theme=transparent&hide_border=true&rank_icon=github&include_all_commits=true&custom_title=GitHub%20Stats" \
            --output profile/stats.svg

          curl --fail --location --retry 3 --retry-all-errors \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=${OWNER}&layout=compact&theme=transparent&hide_border=true&langs_count=8&custom_title=Most%20Used%20Languages" \
            --output profile/top-langs.svg

          test -s profile/stats.svg
          test -s profile/top-langs.svg

      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Cards are already up to date."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
